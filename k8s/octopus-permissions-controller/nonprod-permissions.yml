# Kubernetes Agent permission scoping for the aks-nonprod cluster only —
# see production-permissions.yml for aks-production and for the RBAC
# format notes (lowercase verbs, bare apiGroups, why patch is required
# alongside update) that apply equally here.
#
# Namespaces here match k8s/bindings/aks-nonprod-dev.env and
# aks-nonprod-test.env. `environments:` below uses Octopus's lowercase
# environment slugs (development, test) — these are independent of each
# .env file's own ENVIRONMENT value, which is just an app-level label.

# Broad read access in space `default` for anything in app-dev
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: dev-get-access
  namespace: app-dev
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Broad read access in space `default` for anything in app-test
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: test-get-access
  namespace: app-test
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Full deploy-process access, space `default` + Development environment,
# app-dev namespace. Covers every resource kind the app's deployment
# process actually renders (see k8s/templates/) — not just Deployments.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: dev-full-access
  namespace: app-dev
spec:
  scope:
    spaces: [default]
    environments: [development]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]

---
# Full deploy-process access, space `default` + Test environment,
# app-test namespace. Same resource coverage as dev-full-access above.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: test-full-access
  namespace: app-test
spec:
  scope:
    spaces: [default]
    environments: [test]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]
