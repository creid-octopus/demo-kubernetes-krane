# Kubernetes Agent permission scoping for the aks-nonprod cluster only —
# see production-permissions.yml for the aks-production cluster.
#
# Namespaces here match k8s/bindings/aks-nonprod-dev.env and
# aks-nonprod-test.env. Environment scope values are lowercase slugs
# (development, test), not the display names (Development, Test) —
# WorkloadServiceAccount scope matching is by slug.
#
# verbs are lowercase (get/list/create...) and apiGroups are bare group
# names (apps, "", policy) — not apiVersion strings like apps/v1 — per
# the real sample in the Octopus Permissions Controller repo:
# https://github.com/OctopusDeploy/octopus-permissions-controller/blob/main/config/samples/v1beta1_clusterworkloadserviceaccount.yaml
#
# patch is included alongside update — `kubectl apply` (what krane calls
# under the hood) always issues a PATCH, never a PUT. update and patch
# are distinct RBAC verbs; granting update alone doesn't cover apply.

# Broad read access in space `default` for anything in app-dev
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: dev-get-access
  namespace: app-dev
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Broad read access in space `default` for anything in app-test
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: test-get-access
  namespace: app-test
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Full deploy-process access, space `default` + Development environment,
# app-dev namespace. Covers every resource kind the app's deployment
# process actually renders (see k8s/templates/) — not just Deployments.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: dev-full-access
  namespace: app-dev
spec:
  scope:
    spaces: [default]
    environments: [development]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]

---
# Full deploy-process access, space `default` + Test environment,
# app-test namespace. Same resource coverage as dev-full-access above.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: test-full-access
  namespace: app-test
spec:
  scope:
    spaces: [default]
    environments: [test]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]
