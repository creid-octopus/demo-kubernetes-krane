# Kubernetes Agent permission scoping for the aks-production cluster
# only — see nonprod-permissions.yml for aks-nonprod.
#
# Namespace/environment here match k8s/bindings/aks-production.env and
# the aks-production target's configured Octopus environment. Scope
# values are lowercase slugs (production), not display names.
#
# verbs are lowercase (get/list/create...) and apiGroups are bare group
# names (apps, "", policy) — not apiVersion strings like apps/v1 — per
# the real sample in the Octopus Permissions Controller repo:
# https://github.com/OctopusDeploy/octopus-permissions-controller/blob/main/config/samples/v1beta1_clusterworkloadserviceaccount.yaml
#
# patch is included alongside update — `kubectl apply` (what krane calls
# under the hood) always issues a PATCH, never a PUT. update and patch
# are distinct RBAC verbs; granting update alone doesn't cover apply.
#

# Broad read access in space `default` for anything in app-production
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-get-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Full deploy-process access, space `default` + Production environment,
# app-production namespace. Covers every resource kind the app's
# deployment process actually renders (see k8s/templates/) — not just
# Deployments.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-full-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
    environments: [production]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]

---
# Cluster-scoped grants for aks-production. Three unrelated things live
# here, all required at cluster scope regardless of app-level RBAC. Note
# the third rule uses nonResourceURLs instead of apiGroups/resources —
# per the CRD's own schema, a single rule can be one or the other, never
# both (confirmed against the real CRD schema, not assumed):
# https://github.com/OctopusDeploy/octopus-permissions-controller/blob/main/config/crd/bases/agent.octopus.com_clusterworkloadserviceaccounts.yaml
#
# 1. namespaces (get/list/patch, deliberately no create) — Namespace
#    isn't a namespaced resource, so no WorkloadServiceAccount
#    (namespace-scoped Role) can ever grant access to it. patch is
#    required even for the read-only-feeling case: `kubectl apply`
#    always tries to patch in its last-applied-configuration annotation,
#    even on an object that already matches — get alone can't satisfy
#    that, but this namespace was never created via apply/create
#    --save-config, so it's missing that annotation. This is the
#    intentional demo point: the "Create namespace if not exists" step
#    succeeds against an already-existing app-production (patch), but
#    still can't create one from scratch if it's missing — in
#    production, namespace provisioning is an admin action, not
#    something the deploy identity can do itself.
#
# 2. customresourcedefinitions (get/list) — krane itself does a
#    cluster-wide CRD discovery pass at startup (used for validating/
#    pruning resource kinds), independent of anything this app deploys.
#
# 3. API discovery paths (get) — krane/kubectl hit the raw API surface
#    (starting with "/") at startup to discover what the server supports
#    before doing anything else. #2 and #3 are baseline krane/kubectl
#    requirements in every environment, regardless of app-level
#    permissions — not demo-specific like #1.
apiVersion: agent.octopus.com/v1beta1
kind: ClusterWorkloadServiceAccount
metadata:
  name: production-cluster-read
spec:
  scope:
    spaces: [default]
    environments: [production]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, patch]
        apiGroups: [""]
        resources: [namespaces]
      - verbs: [get, list]
        apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
      - verbs: [get]
        nonResourceURLs:
          - "/"
          - "/api"
          - "/api/*"
          - "/apis"
          - "/apis/*"
          - "/version"
