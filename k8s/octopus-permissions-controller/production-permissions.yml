# Kubernetes Agent permission scoping for the aks-production cluster
# only — see nonprod-permissions.yml for aks-nonprod.
#
# Namespace/environment here match k8s/bindings/aks-production.env and
# the aks-production target's configured Octopus environment. `scope`
# values below are Octopus's lowercase slugs (production), not display
# names — WorkloadServiceAccount scope matching is by slug.
#
# Format rules, per the real sample in the Octopus Permissions
# Controller repo (github.com/OctopusDeploy/octopus-permissions-controller,
# config/samples/v1beta1_clusterworkloadserviceaccount.yaml):
#   - verbs are lowercase (get/list/create...)
#   - apiGroups are bare group names (apps, "", policy), not apiVersion
#     strings like apps/v1
#   - patch is included alongside update: `kubectl apply` (what krane
#     calls under the hood) always issues a PATCH, never a PUT — update
#     and patch are distinct RBAC verbs, and granting update alone
#     doesn't cover apply.

# Broad read access in space `default` for anything in app-production
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-get-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Full deploy-process access, space `default` + Production environment,
# app-production namespace. Covers every resource kind the app's
# deployment process actually renders (see k8s/templates/) — not just
# Deployments.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-full-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
    environments: [production]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, patch, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]

---
# Cluster-scoped grants for aks-production — three unrelated things, all
# required regardless of app-level RBAC since Namespace/CRD/API-discovery
# aren't namespaced resources a WorkloadServiceAccount could ever cover.
#
# namespaces: get/list/patch, deliberately no create. `kubectl apply`
# always tries to patch in the last-applied-configuration annotation, even
# on a no-op — this namespace predates being managed by apply, so it's
# missing that annotation and needs patch to satisfy it. No create is the
# intentional demo point: this identity can confirm app-production exists
# but can't create one from scratch — namespace provisioning is an admin
# action, not a deploy-time one.
#
# customresourcedefinitions: get/list — krane does a cluster-wide CRD
# discovery pass at startup, independent of anything this app deploys.
#
# nonResourceURLs (get on "/", "/api", etc.): krane/kubectl hit the raw
# API surface at startup to discover what the server supports. A single
# rule uses either apiGroups/resources or nonResourceURLs, never both —
# per the CRD's schema:
# https://github.com/OctopusDeploy/octopus-permissions-controller/blob/main/config/crd/bases/agent.octopus.com_clusterworkloadserviceaccounts.yaml
apiVersion: agent.octopus.com/v1beta1
kind: ClusterWorkloadServiceAccount
metadata:
  name: production-cluster-read
spec:
  scope:
    spaces: [default]
    environments: [production]
    projects: [kubernetes-krane]
  permissions:
    permissions:
      - verbs: [get, list, patch]
        apiGroups: [""]
        resources: [namespaces]
      - verbs: [get, list]
        apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
      - verbs: [get]
        nonResourceURLs:
          - "/"
          - "/api"
          - "/api/*"
          - "/apis"
          - "/apis/*"
          - "/version"
