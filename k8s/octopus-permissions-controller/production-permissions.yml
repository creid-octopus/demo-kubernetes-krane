# Kubernetes Agent permission scoping for the aks-production cluster
# only — see nonprod-permissions.yml for aks-nonprod. Moved out of that
# file, where it was previously (incorrectly) mixed in with nonprod
# resources.
#
# Namespace/environment here match k8s/bindings/aks-production.env and
# the aks-production target's configured Octopus environment. Scope
# values are lowercase slugs (production), not display names.
#
# verbs are lowercase (get/list/create...) and apiGroups are bare group
# names (apps, "", policy) — not apiVersion strings like apps/v1 — per
# the real sample in the Octopus Permissions Controller repo:
# https://github.com/OctopusDeploy/octopus-permissions-controller/blob/main/config/samples/v1beta1_clusterworkloadserviceaccount.yaml
#
# Note: the aks-production target is also associated with a
# "Meta-Production" environment in your instance — not included below
# since it's not obviously tied to this app. Add a scope for it here if
# it should also get access to app-production.

# Broad read access in space `default` for anything in app-production
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-get-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: ["*"]
        resources: ["*"]

---
# Full deploy-process access, space `default` + Production environment,
# app-production namespace. Covers every resource kind the app's
# deployment process actually renders (see k8s/templates/) — not just
# Deployments.
apiVersion: agent.octopus.com/v1beta1
kind: WorkloadServiceAccount
metadata:
  name: production-full-access
  namespace: app-production
spec:
  scope:
    spaces: [default]
    environments: [production]
  permissions:
    permissions:
      - verbs: [get, list, create, update, delete]
        apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - verbs: [get, list, create, update, delete]
        apiGroups: [""]
        resources: [configmaps, services]
      - verbs: [get, list, create, update, delete]
        apiGroups: [policy]
        resources: [poddisruptionbudgets]

---
# Cluster-scoped, deliberately get/list only — Namespace isn't a
# namespaced resource, so no WorkloadServiceAccount (namespace-scoped
# Role) can ever grant access to it, regardless of what verbs it lists.
# This is the intentional demo point: the "Create namespace if not
# exists" step can check whether app-production exists, but can't create
# it — in production, namespace provisioning is an admin action, not
# something the deploy identity can do itself. Deploying against a
# namespace that doesn't exist yet should fail here, not silently
# succeed by creating one.
apiVersion: agent.octopus.com/v1beta1
kind: ClusterWorkloadServiceAccount
metadata:
  name: production-namespace-read
spec:
  scope:
    spaces: [default]
    environments: [production]
  permissions:
    permissions:
      - verbs: [get, list]
        apiGroups: [""]
        resources: [namespaces]
