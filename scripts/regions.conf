# One production "region" per line: region:context:bindings-file
#
# Today every region's context is the same local kind cluster and regions
# are really just namespaces on it (app-us, app-eu). To graduate to real
# multi-cluster/multi-region, change the context column to a real
# kubeconfig context/cluster name per region — deploy.sh and fan-out.sh
# don't need to change at all.
#
# Add more lines (with matching k8s/bindings/*.env files) to model
# additional regions.
us:kind-demo-krane:k8s/bindings/us.env
eu:kind-demo-krane:k8s/bindings/eu.env
