# Buildkite -> Octopus, OIDC-authenticated. Two steps, building iteratively:
#
#   Layer 1 (octopus-oidc-login) — proves a Buildkite agent can mint its own
#     OIDC token and trade it for a short-lived Octopus access token, with
#     zero long-lived secrets (no OCTOPUS_API_KEY anywhere). Left in place
#     as an ongoing auth canary.
#
#   Layer 2 (octopus-publish) — the real version of publish.yml's stub
#     steps: build the image, push it to GHCR, push build information,
#     create a release, and deploy to Development.
#
# Prerequisites (see PLAN.md / conversation notes for the full writeup):
#   - An Octopus service account + team + "Build server" role scoped to the
#     Kubernetes - Krane project (Projects-22).
#   - An OIDC identity on that service account:
#       Issuer:   https://agent.buildkite.com
#       Subject:  organization:octopus-deploy:pipeline:creid-oidc-buildinfo:ref:*:commit:*:step:*
#       Audience: <the service account's GUID>
#   - OCTOPUS_SERVICE_ACCOUNT_ID below set to that same GUID.
#   - A local Buildkite agent running (see buildkiteplanning/ or the
#     conversation notes for the `docker run buildkite/agent:3` command).
#   - Buildkite secrets GhcrPushToken and CommitsApiKey (see the
#     octopus-publish step below for what each is for).
#
# TODO: tighten the OIDC Subject above — swap the ref/commit/step wildcards
# for `buildkite-agent oidc request-token --subject-claim pipeline_id` and
# the pipeline's UUID, which is an exact match instead of a wildcard match.
# Left wildcarded for now since real steps only just landed.

env:
  OCTOPUS_SERVER_URL: "https://creid.octopus.app"
  OCTOPUS_SERVICE_ACCOUNT_ID: "379be2d0-dc30-4e55-9234-60f514c45fca"
  OCTOPUS_PROJECT: "Kubernetes - Krane"
  OCTOPUS_CHANNEL: "Default"
  OCTOPUS_ENVIRONMENT: "Development"
  # Feed package ID (Feeds-1021, GHCR-creid-octopus) vs. the deployment
  # process's local package reference name — these are two different
  # strings in Octopus and the CLI cares which one you use where:
  #   - build-information is keyed by the real feed package ID.
  #   - release create's --package wants the deployment process's
  #     reference name (see the "Run `deploy.sh`..." step's Packages
  #     block, Name: "demo-kubernetes-krane" -> PackageId:
  #     "creid-octopus/demo-kubernetes-krane" on Feeds-1021).
  OCTOPUS_PACKAGE_ID: "creid-octopus/demo-kubernetes-krane"
  OCTOPUS_PACKAGE_REFERENCE_NAME: "demo-kubernetes-krane"
  IMAGE_REPO: "ghcr.io/creid-octopus/demo-kubernetes-krane"
  VERSION_MAJOR: "0"
  VERSION_MINOR: "1"

steps:
  - label: ":octopus: OIDC login smoke test"
    key: "octopus-oidc-login"
    command: |
      set -euo pipefail

      echo "--- :mag: Checking for an existing Octopus CLI"
      if command -v octopus >/dev/null 2>&1; then
        echo "Found existing octopus CLI at $$(command -v octopus), skipping install"
      else
        echo "octopus CLI not found, installing"
        curl -sL https://github.com/OctopusDeploy/cli/raw/main/scripts/install.sh | bash
        export PATH="$$PATH:/usr/local/bin"
      fi
      octopus version

      echo "--- :key: Requesting a Buildkite OIDC token"
      OCTOPUS_ID_TOKEN=$$(buildkite-agent oidc request-token --audience "$$OCTOPUS_SERVICE_ACCOUNT_ID")

      echo "--- :octopus: Exchanging it for an Octopus access token"
      octopus login \
        --server "$$OCTOPUS_SERVER_URL" \
        --service-account-id "$$OCTOPUS_SERVICE_ACCOUNT_ID" \
        --id-token "$$OCTOPUS_ID_TOKEN"

      echo "--- :white_check_mark: Verifying the session (no API key was used anywhere above)"
      octopus space list
      octopus project list --space "Default"
    agents:
      queue: "default-queue"

  # Layer 2 — build, push, register build information, create a release,
  # and deploy to Development. This is the real version of publish.yml's
  # stub steps (push package / push build info / create release / deploy),
  # now actually wired to your Octopus project.
  #
  # The Kubernetes - Krane project's "Default" channel has a version rule
  # requiring the package's version to carry a `sha-<7 hex chars>`
  # pre-release tag (checked directly against the project's channel
  # config) — that's why VERSION below matches build-image.yml's second
  # tag format (major.minor.build-sha-shortsha) rather than a plain counter.
  # Skipping this would mean the release doesn't land in Default and the
  # command may reject with no matching channel.
  #
  # Two Buildkite secrets this step needs that Layer 1 didn't:
  #   - GhcrPushToken: a GitHub PAT (classic or fine-grained) scoped to
  #     write:packages on creid-octopus/demo-kubernetes-krane, used only
  #     for `docker push` to GHCR. This is the one real, static credential
  #     in the whole pipeline — GHCR has no third-party OIDC federation
  #     today (Docker's new OIDC support is Docker Hub + GitHub Actions
  #     only, not GHCR, not Buildkite, as of this writing).
  #   - CommitsApiKey: a Buildkite API access token (read_builds scope),
  #     same one your teammate's bk-pipeline-sample.yml already uses, to
  #     look up the last successful build's commit for the build
  #     information commit range. If this secret isn't set, the script
  #     falls back to just the current commit rather than failing.
  - label: ":docker: Build, publish, and deploy via Octopus"
    key: "octopus-publish"
    secrets:
      - GhcrPushToken
      - CommitsApiKey
    command: |
      set -euo pipefail

      echo "--- :mag: Scaffold: checking required tooling"
      if command -v octopus >/dev/null 2>&1; then
        echo "Found existing octopus CLI at $$(command -v octopus), skipping install"
      else
        echo "octopus CLI not found, installing"
        curl -sL https://github.com/OctopusDeploy/cli/raw/main/scripts/install.sh | bash
        export PATH="$$PATH:/usr/local/bin"
      fi
      octopus version
      docker version

      echo "--- :key: OIDC login"
      OCTOPUS_ID_TOKEN=$$(buildkite-agent oidc request-token --audience "$$OCTOPUS_SERVICE_ACCOUNT_ID")
      octopus login \
        --server "$$OCTOPUS_SERVER_URL" \
        --service-account-id "$$OCTOPUS_SERVICE_ACCOUNT_ID" \
        --id-token "$$OCTOPUS_ID_TOKEN"

      echo "--- :git: Compute version"
      SHORT_SHA="$${BUILDKITE_COMMIT:0:7}"
      VERSION="$${VERSION_MAJOR}.$${VERSION_MINOR}.$${BUILDKITE_BUILD_NUMBER}-sha-$${SHORT_SHA}"
      buildkite-agent meta-data set "version" "$$VERSION"
      echo "Version: $$VERSION"

      echo "--- :docker: Build image"
      docker build \
        --target release \
        --build-arg APP_VERSION="$$VERSION" \
        --build-arg APP_BRANCH="$$BUILDKITE_BRANCH" \
        --build-arg APP_BUILD="$$BUILDKITE_BUILD_NUMBER" \
        --build-arg APP_COMMIT_SHA="$$BUILDKITE_COMMIT" \
        -t "$$IMAGE_REPO:$$VERSION" \
        app

      echo "--- :docker: Push image to GHCR"
      GHCR_PUSH_TOKEN="$$(buildkite-agent secret get GhcrPushToken)"
      echo "$$GHCR_PUSH_TOKEN" | docker login ghcr.io -u "creid-octopus" --password-stdin
      docker push "$$IMAGE_REPO:$$VERSION"

      echo "--- :information_source: Assemble and push build information"
      COMMITS_API_KEY="$$(buildkite-agent secret get CommitsApiKey || true)"
      LAST_SUCCESSFUL_COMMIT=""
      if [ -n "$$COMMITS_API_KEY" ]; then
        LAST_SUCCESSFUL_COMMIT=$$(curl -s \
          -H "Authorization: Bearer $$COMMITS_API_KEY" \
          "https://api.buildkite.com/v2/organizations/$${BUILDKITE_ORGANIZATION_SLUG}/pipelines/$${BUILDKITE_PIPELINE_SLUG}/builds?branch=$${BUILDKITE_BRANCH}&state=passed&per_page=1" \
          | jq -r '.[0].commit // empty')
      fi

      if [ -z "$$LAST_SUCCESSFUL_COMMIT" ]; then
        echo "No previous successful build found (or CommitsApiKey not set) — using just this commit"
        COMMIT_RANGE="$$BUILDKITE_COMMIT"
      else
        echo "Last successful build commit: $$LAST_SUCCESSFUL_COMMIT"
        COMMIT_RANGE="$${LAST_SUCCESSFUL_COMMIT}..$${BUILDKITE_COMMIT}"
      fi

      REPO_WEB_URL="https://github.com/creid-octopus/demo-kubernetes-krane"

      COMMITS_JSON=$$(git log "$$COMMIT_RANGE" --pretty=format:'%H%x1f%s' \
        | while IFS=$$'\x1f' read -r hash subject; do
            jq -n --arg id "$$hash" --arg comment "$$subject" --arg url "$$REPO_WEB_URL/commit/$$hash" \
              '{Id: $$id, LinkUrl: $$url, Comment: $$comment}'
          done | jq -s '.')

      jq -n \
        --arg branch "$$BUILDKITE_BRANCH" \
        --arg buildUrl "$$BUILDKITE_BUILD_URL" \
        --arg buildNumber "$$BUILDKITE_BUILD_NUMBER" \
        --arg vcsCommit "$$BUILDKITE_COMMIT" \
        --arg vcsRoot "$$REPO_WEB_URL" \
        --argjson commits "$$COMMITS_JSON" \
        '{
          Branch: $$branch,
          BuildUrl: $$buildUrl,
          BuildNumber: $$buildNumber,
          BuildEnvironment: "Buildkite",
          VcsType: "Git",
          VcsRoot: $$vcsRoot,
          VcsCommitNumber: $$vcsCommit,
          Commits: $$commits
        }' > BuildInformation.json

      octopus build-information upload \
        --package-id "$$OCTOPUS_PACKAGE_ID" \
        --version "$$VERSION" \
        --file BuildInformation.json

      echo "--- :rocket: Create release"
      octopus release create \
        --project "$$OCTOPUS_PROJECT" \
        --package "$${OCTOPUS_PACKAGE_REFERENCE_NAME}:$${VERSION}" \
        --version "$$VERSION" \
        --channel "$$OCTOPUS_CHANNEL" \
        --no-prompt

      echo "--- :arrow_forward: Deploy to $$OCTOPUS_ENVIRONMENT"
      octopus release deploy \
        --project "$$OCTOPUS_PROJECT" \
        --version "$$VERSION" \
        --environment "$$OCTOPUS_ENVIRONMENT" \
        --output-format basic \
        --no-prompt \
        | octopus task wait
    agents:
      queue: "default-queue"
