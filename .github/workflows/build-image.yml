# Container image build — stands in for "CI builds + pushes to a single
# shared ECR repo, tagged by commit SHA," a common pattern for teams
# running krane across multiple regions.
#
# Difference from that real-world pattern: pushes to GHCR instead of
# ECR, and there's no per-region copy step here either — every
# region/namespace pulls the same image, just from GHCR instead of ECR.
#
# Versioning:
#   main → <major>.<minor>.<run>          e.g. 0.1.42
#   Each push produces a semver tag and a SHA-pinned tag, same pattern as
#   the composite-development-loop reference.

name: Build image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_MAJOR: "0"
  VERSION_MINOR: "1"

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          target: release
          tags: |
            ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}-sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_BRANCH=${{ github.ref_name }}
            APP_BUILD=${{ github.run_number }}
            APP_COMMIT_SHA=${{ github.sha }}

      - name: Image summary
        run: |
          {
            echo "### Image — \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version tag** | \`${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}\` |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |"
            echo ""
            echo "This is the single image every region/namespace pulls from — same"
            echo "model as the single US ECR repo in the real flow."
          } >> "$GITHUB_STEP_SUMMARY"
