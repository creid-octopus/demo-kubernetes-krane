# Octopus integration — real, OIDC-authenticated.
#
# Builds the image, uploads build information, and pushes the image to GHCR.
# It stops there: release creation and deployment belong to Octopus, via the
# "New Image Version Pushed" feed trigger. No API key anywhere in this
# workflow.
#
# See OIDC.md for the shared design details: the SA-GHA service account and
# OIDC identity, why release creation moved to the feed trigger, why the image
# is built here rather than in a separate workflow, and why VERSION carries a
# `sha-<7 hex>` suffix.

name: Publish

# A squash merge to main *is* a push to main, so the push trigger below
# already covers merged PRs — no separate `pull_request: types: [closed]`
# trigger is needed, and adding one would double-fire on every merge.
#
# What was actually blocking merged PRs from building: the `paths: app/**`
# filter. The generated build-info PRs only touch build-info.txt, so nothing
# fired. The filter is gone deliberately — every commit reaching main should
# produce an image and a release, so there's always a package for the
# Validate Release gate to inspect. That does mean doc-only commits build too;
# an acceptable trade for a demo repo where release volume is the point.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OctopusDeploy/login to fetch a GitHub OIDC token
  contents: read    # required for actions/checkout, since permissions: resets defaults
  packages: write   # required to push the image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_MAJOR: "0"
  VERSION_MINOR: "1"
  OCTOPUS_SERVER_URL: "https://creid.octopus.app"
  OCTOPUS_SERVICE_ACCOUNT_ID: "d7b6439c-edd8-4f5c-b035-ad3a647807b4"
  OCTOPUS_SPACE: "Default"

jobs:
  publish:
    name: Build and publish for Octopus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so push-build-information-action has commits to
          # walk — the default shallow clone (depth=1) leaves it nothing.
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}-sha-${SHORT_SHA}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      # Octopus login and build information come *before* the image push, on
      # purpose. The image landing in GHCR is what the feed trigger watches,
      # so pushing it is what starts release creation — build information has
      # to already be in place or the trigger can fire against a version with
      # none attached. Build information is keyed by package ID + version and
      # stored independently of the package, so uploading it before the image
      # exists is fine. Keep in sync with .buildkite/pipeline.yml.
      - name: Log into Octopus
        uses: OctopusDeploy/login@v1
        with:
          server: ${{ env.OCTOPUS_SERVER_URL }}
          service_account_id: ${{ env.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # No push-package step — the image is referenced from the GHCR
      # external feed directly (see OIDC.md).
      - name: Push build information
        uses: OctopusDeploy/push-build-information-action@v4
        with:
          space: ${{ env.OCTOPUS_SPACE }}
          packages: |
            ${{ env.IMAGE_NAME }}
          version: ${{ steps.meta.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom disabled deliberately. build-push-action defaults
      # provenance on, which pushes an OCI image *index* containing the real
      # image plus an `unknown/unknown` attestation manifest. Octopus reads
      # that attestation entry's annotations (vnd.docker.reference.*) as the
      # package's image labels, hiding org.opencontainers.image.revision from
      # the Validate Release gate. Keep in sync with .buildkite/pipeline.yml,
      # which passes the equivalent --provenance=false --sbom=false.
      # This push is what triggers Octopus — nothing after it is required for
      # the release to be created correctly.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          provenance: false
          sbom: false
          target: release
          tags: ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}
          # Annotations, not just the Dockerfile's LABEL block. Octopus reads
          # OCI manifest annotations as Image.Labels[...] — a different channel
          # from Docker image config labels, which is where LABEL writes. See
          # OIDC.md. Keep in sync with .buildkite/pipeline.yml.
          annotations: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_BRANCH=${{ github.ref_name }}
            APP_BUILD=${{ github.run_number }}
            APP_COMMIT_SHA=${{ github.sha }}

      # No create-release or deploy-release step. Octopus owns both, via the
      # "New Image Version Pushed" feed trigger — see OIDC.md for why.
      - name: Summary
        run: |
          {
            echo "### Publish — \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "Pushed \`${{ steps.meta.outputs.version }}\` to GHCR with build"
            echo "information attached, authenticated to Octopus with OIDC — no"
            echo "API key anywhere in this workflow."
            echo ""
            echo "Octopus polls the GHCR feed roughly every 3 minutes; the"
            echo "\`New Image Version Pushed\` trigger creates the release, and the"
            echo "Fast Dev lifecycle auto-deploys it to Development."
          } >> "$GITHUB_STEP_SUMMARY"
