# Octopus integration — real, OIDC-authenticated.
#
# Builds and pushes the image, pushes build information, creates a release,
# and deploys to Development — no API key anywhere in this workflow.
#
# See OIDC.md for the shared design details: the SA-GHA service account and
# OIDC identity, why the image is built here rather than in a separate
# workflow, and why VERSION carries a `sha-<7 hex>` suffix.

name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  id-token: write   # required for OctopusDeploy/login to fetch a GitHub OIDC token
  contents: read    # required for actions/checkout, since permissions: resets defaults
  packages: write   # required to push the image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_MAJOR: "0"
  VERSION_MINOR: "1"
  OCTOPUS_SERVER_URL: "https://creid.octopus.app"
  OCTOPUS_SERVICE_ACCOUNT_ID: "d7b6439c-edd8-4f5c-b035-ad3a647807b4"
  OCTOPUS_PROJECT: "Kubernetes - Krane"
  OCTOPUS_SPACE: "Default"
  OCTOPUS_CHANNEL: "Default"
  OCTOPUS_ENVIRONMENT: "Development"

jobs:
  publish:
    name: Build, publish, and deploy via Octopus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so push-build-information-action has commits to
          # walk — the default shallow clone (depth=1) leaves it nothing.
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}-sha-${SHORT_SHA}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          target: release
          tags: ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_BRANCH=${{ github.ref_name }}
            APP_BUILD=${{ github.run_number }}
            APP_COMMIT_SHA=${{ github.sha }}

      - name: Log into Octopus
        uses: OctopusDeploy/login@v1
        with:
          server: ${{ env.OCTOPUS_SERVER_URL }}
          service_account_id: ${{ env.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # No push-package step — the image is referenced from the GHCR
      # external feed directly (see OIDC.md).

      - name: Push build information
        uses: OctopusDeploy/push-build-information-action@v4
        with:
          space: Default
          packages: |
            ${{ env.IMAGE_NAME }}
          version: ${{ steps.meta.outputs.version }}

      # custom_fields mirrors the --custom-field flags the Buildkite pipeline
      # passes to `octopus release create`, so a release carries the same
      # provenance metadata whichever CI system produced it. Unlike build
      # information, custom fields live on the release resource itself and are
      # readable from anywhere, including deployment steps.
      #
      # No BuildNumber field: with two CI systems writing releases to the same
      # project, their build counters are independent, so a bare number is
      # ambiguous about which system to go look in — and a run URL is both
      # unambiguous and directly clickable. Custom field values render as
      # plain text (Markdown links do not resolve), so the URL goes in raw.
      - name: Create Octopus release
        uses: OctopusDeploy/create-release-action@v3
        with:
          space: Default
          project: ${{ env.OCTOPUS_PROJECT }}
          channel: ${{ env.OCTOPUS_CHANNEL }}
          release_number: ${{ steps.meta.outputs.version }}
          package_version: ${{ steps.meta.outputs.version }}
          custom_fields: |
            BuildUrl:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            CommitSha:${{ github.sha }}
            Branch:${{ github.ref_name }}

      - name: Deploy to Development
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          space: Default
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ steps.meta.outputs.version }}
          environments: |
            ${{ env.OCTOPUS_ENVIRONMENT }}

      - name: Summary
        run: |
          {
            echo "### Publish — \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "Released and deployed \`${{ steps.meta.outputs.version }}\` to"
            echo "${{ env.OCTOPUS_ENVIRONMENT }} via Octopus, authenticated with"
            echo "OIDC — no API key anywhere in this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
