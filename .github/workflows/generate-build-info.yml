# Generates throwaway commits on a branch, opens a PR, and (optionally) turns
# on auto-merge — so the whole path exercises itself: PR checks, squash merge,
# post-merge CI, Buildkite release, and the Validate Release gate.
#
# The schedule is here to stress-test that gate, not as a permanent fixture.
# Comment out the `schedule:` block (or disable the workflow under Actions)
# once you've generated enough releases to test with. Two things worth knowing
# about GitHub's cron: it's best-effort and can lag well past the stated
# interval under load, and scheduled workflows are disabled automatically
# after 60 days without repository activity.

name: Generate Build Info

on:
  workflow_dispatch:
    inputs:
      commit_count:
        description: "Commits to generate. Blank or 'random' picks 3-15."
        required: false
        default: "random"
      auto_merge:
        description: "Enable auto-merge on the PR so it lands without help."
        type: boolean
        required: false
        default: true
  schedule:
    # Every 30 minutes. See the note above before leaving this on.
    - cron: "*/30 * * * *"

# Each run branches from main and pushes a uniquely-named branch, so parallel
# runs won't clobber each other — but they would race on build-info.txt's
# numbering and produce confusing overlapping PRs. Serialize instead.
concurrency:
  group: generate-build-info
  cancel-in-progress: false

jobs:
  generate-build-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_GITHUB_PAT }}

      - name: Create New Branch
        run: |
          BRANCH="build-info-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH

      - name: Prepare build-info.txt
        run: |
          if [ -f build-info.txt ]; then
            grep -E '^(#|$)' build-info.txt > tmp-build-info.txt || true
            mv tmp-build-info.txt build-info.txt
          else
            echo "# Build Information Log" > build-info.txt
            echo "# Generated by automated workflow" >> build-info.txt
            echo "" >> build-info.txt
          fi

      - name: Generate Random Commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERBS=("Generated" "Injected" "Spun up" "Whipped up" "Drafted" 
                 "Fabricated" "Conjured" "Grew" "Compacted" "Sculpted"
                 "Forged" "Turbocharged" "Supercharged" "Anchored" "Propelled")
          NOUNS=("build artifacts" "deployment configs" "release notes" 
                 "service manifests" "infrastructure specs" "cluster rules"
                 "container images" "deployment pipelines" "cluster telemetry"
                 "gateway configs" "service meshes" "ingress routes"
                 "helm charts" "Kubernetes resources" "cluster state")
          OUTCOMES=("for production readiness" "with zero downtime in mind"
                    "for the next release cycle" "because the cluster demanded it"
                    "before morning standup" "with full test coverage (allegedly)"
                    "and nobody complained" "against my better judgment"
                    "at 3am because why not" "with maximum enthusiasm"
                    "like my job depended on it" "because someone had to"
                    "with a side of caution" "in the most robust way possible"
                    "because the metrics said so")

          # A scheduled run has no inputs, so it falls through to random.
          # Note the random range (3-15) sits at or above the Validate Release
          # gate's limit of 2, so those PRs are *expected* to be blocked at
          # deploy time — that's the block path being exercised. Dispatch with
          # commit_count=1 or 2 to generate releases that should pass instead.
          REQUESTED="${{ inputs.commit_count }}"
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "random" ]; then
            NUM_COMMITS=$(( RANDOM % 13 + 3 ))
            echo "No commit_count given — generating a random $NUM_COMMITS commits"
          elif ! echo "$REQUESTED" | grep -qE '^[0-9]+$' || [ "$REQUESTED" -lt 1 ]; then
            echo "commit_count must be a positive integer or 'random', got '$REQUESTED'" >&2
            exit 1
          else
            NUM_COMMITS="$REQUESTED"
            echo "Generating $NUM_COMMITS commits as requested"
          fi

          # Each `run:` block is its own shell, so a plain variable doesn't
          # survive into the "Open PR" and "Summary" steps below — without this
          # they interpolate an empty string ("( commits)" in the PR title).
          echo "NUM_COMMITS=$NUM_COMMITS" >> "$GITHUB_ENV"

          BUILD_NUMBER=1
          if [ -f build-info.txt ]; then
            LAST_NUM=$(grep -oP '#[Bb]uild #[0-9]+' build-info.txt | grep -oP '[0-9]+' | tail -1)
            if [ -n "$LAST_NUM" ]; then
              BUILD_NUMBER=$((LAST_NUM + 1))
            fi
          fi

          for i in $(seq 1 $NUM_COMMITS); do
            VERB="${VERBS[$RANDOM % ${#VERBS[@]}]}"
            NOUN="${NOUNS[$RANDOM % ${#NOUNS[@]}]}"
            OUTCOME="${OUTCOMES[$RANDOM % ${#OUTCOMES[@]}]}"
            SHA_SHORT=$(git rev-parse --short HEAD)
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            
            CLEAN_MSG="$VERB $NOUN $OUTCOME"
            
            echo "---" >> build-info.txt
            echo "# Build #$BUILD_NUMBER | $TIMESTAMP | sha:$SHA_SHORT" >> build-info.txt
            echo "$CLEAN_MSG" >> build-info.txt
            
            git add build-info.txt
            git commit -m "$CLEAN_MSG - build #$BUILD_NUMBER ($SHA_SHORT)"
            
            echo "Commit $i/$NUM_COMMITS: $CLEAN_MSG (build #$BUILD_NUMBER)"
            
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          done

      - name: Push Branch
        run: git push origin $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_GITHUB_PAT }}

      - name: Open PR
        id: pr
        run: |
          DATE_STR=$(date -u +"%Y-%m-%d %H:%M UTC")
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Build info update $DATE_STR ($NUM_COMMITS commits)" \
            --body "Automated build info commits generated $DATE_STR for Buildkite CI + Octopus Deploy testing.

          Commits in this PR: **$NUM_COMMITS**

          The \`Validate Release\` deployment gate blocks changesets of 3 or more commits, so this PR is expected to $( [ "$NUM_COMMITS" -ge 3 ] && echo "**block** at deploy time." || echo "**pass** the changeset check." )")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_PAT }}

      # Squash keeps one commit per PR on main, which is what the gate's
      # commit-count logic assumes — it reads the PR's pre-squash count rather
      # than diffing the merge commit. Auto-merge only defers the merge if
      # something is actually pending (required checks or reviews); with no
      # branch protection on main the PR is immediately mergeable and this
      # fails, so it soft-fails rather than failing the run.
      - name: Enable auto-merge
        if: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
        run: |
          if gh pr merge "${{ steps.pr.outputs.url }}" --auto --squash; then
            echo "Auto-merge enabled."
          else
            echo "::warning::Couldn't enable auto-merge. This usually means main has no branch protection requiring status checks, so there's nothing for auto-merge to wait on. Merging directly instead."
            gh pr merge "${{ steps.pr.outputs.url }}" --squash || \
              echo "::warning::Direct squash merge also failed — the PR is left open for manual handling."
          fi
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_PAT }}

      - name: Summary
        run: |
          {
            echo "### Generated $NUM_COMMITS commit(s)"
            echo ""
            echo "- PR: ${{ steps.pr.outputs.url }}"
            echo "- Branch: \`$BRANCH\`"
            if [ "$NUM_COMMITS" -ge 3 ]; then
              echo "- Expected at deploy time: **blocked** by Validate Release (3+ commits)"
            else
              echo "- Expected at deploy time: **passes** the changeset check"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
