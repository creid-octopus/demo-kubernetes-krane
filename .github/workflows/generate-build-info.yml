name: Generate Build Info

on:
  workflow_dispatch: # Manual trigger

jobs:
  generate-build-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_GITHUB_PAT }}

      - name: Create New Branch
        run: |
          BRANCH="build-info-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b $BRANCH

      - name: Prepare build-info.txt
        run: |
          if [ -f build-info.txt ]; then
            grep -E '^(#|$)' build-info.txt > tmp-build-info.txt || true
            mv tmp-build-info.txt build-info.txt
          else
            echo "# Build Information Log" > build-info.txt
            echo "# Generated by automated workflow" >> build-info.txt
            echo "" >> build-info.txt
          fi

      - name: Generate Random Commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERBS=("Generated" "Injected" "Spun up" "Whipped up" "Drafted" 
                 "Fabricated" "Conjured" "Grew" "Compacted" "Sculpted"
                 "Forged" "Turbocharged" "Supercharged" "Anchored" "Propelled")
          NOUNS=("build artifacts" "deployment configs" "release notes" 
                 "service manifests" "infrastructure specs" "cluster rules"
                 "container images" "deployment pipelines" "cluster telemetry"
                 "gateway configs" "service meshes" "ingress routes"
                 "helm charts" "Kubernetes resources" "cluster state")
          OUTCOMES=("for production readiness" "with zero downtime in mind"
                    "for the next release cycle" "because the cluster demanded it"
                    "before morning standup" "with full test coverage (allegedly)"
                    "and nobody complained" "against my better judgment"
                    "at 3am because why not" "with maximum enthusiasm"
                    "like my job depended on it" "because someone had to"
                    "with a side of caution" "in the most robust way possible"
                    "because the metrics said so")

          NUM_COMMITS=$(( RANDOM % 13 + 3 ))
          echo "Generating $NUM_COMMITS commits"

          BUILD_NUMBER=1
          if [ -f build-info.txt ]; then
            LAST_NUM=$(grep -oP '#[Bb]uild #[0-9]+' build-info.txt | grep -oP '[0-9]+' | tail -1)
            if [ -n "$LAST_NUM" ]; then
              BUILD_NUMBER=$((LAST_NUM + 1))
            fi
          fi

          for i in $(seq 1 $NUM_COMMITS); do
            VERB="${VERBS[$RANDOM % ${#VERBS[@]}]}"
            NOUN="${NOUNS[$RANDOM % ${#NOUNS[@]}]}"
            OUTCOME="${OUTCOMES[$RANDOM % ${#OUTCOMES[@]}]}"
            SHA_SHORT=$(git rev-parse --short HEAD)
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            
            CLEAN_MSG="$VERB $NOUN $OUTCOME"
            
            echo "---" >> build-info.txt
            echo "# Build #$BUILD_NUMBER | $TIMESTAMP | sha:$SHA_SHORT" >> build-info.txt
            echo "$CLEAN_MSG" >> build-info.txt
            
            git add build-info.txt
            git commit -m "$CLEAN_MSG - build #$BUILD_NUMBER ($SHA_SHORT)"
            
            echo "Commit $i/$NUM_COMMITS: $CLEAN_MSG (build #$BUILD_NUMBER)"
            
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          done

      - name: Push Branch
        run: git push origin $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_GITHUB_PAT }}

      - name: Open PR
        run: |
          DATE_STR=$(date +%Y-%m-%d)
          gh pr create \
            --base main \
            --head $BRANCH \
            --title "Build info update $DATE_STR" \
            --body "Automated build info commits generated on $DATE_STR for Buildkite CI + Octopus Deploy testing."
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_GITHUB_PAT }}
